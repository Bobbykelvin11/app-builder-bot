<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App Builder Bot</title>
  <style>body{font:16px system-ui;max-width:850px;margin:3rem auto;padding:0 1rem;color:#172033}textarea{width:100%;min-height:110px;padding:12px}button{padding:10px 18px;margin:12px 0}pre{white-space:pre-wrap;overflow:auto;background:#f3f5f8;padding:16px;border-radius:8px}</style>
</head>
<body>
  <h1>App Builder Bot</h1><p>Describe a Flutter app to generate a starter <code>lib/main.dart</code>.</p>
  <textarea id="prompt" placeholder="Build a simple habit tracker with a daily checklist..."></textarea><br>
  <button id="go">Generate Flutter code</button><span id="status"></span><pre id="result">Generated code will appear here.</pre>
  <script>
    document.querySelector('#go').onclick = async () => {
      const status = document.querySelector('#status'), out = document.querySelector('#result');
      status.textContent = ' Working…';
      try {
        const r = await fetch('/api/generate', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({prompt:document.querySelector('#prompt').value})});
        const data = await r.json(); if (!r.ok) throw new Error(data.detail || 'Request failed');
        out.textContent = `// ${data.file}\n${data.code}`; status.textContent = ' Done.';
      } catch(e) { status.textContent = ` ${e.message}`; }
    };
  </script>
</body>
</html>
